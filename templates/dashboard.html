{{define "content"}}
<h1>Meine Dateien</h1>
<p class="muted">Angemeldet als {{.User}}. Maximale Grösse pro Datei: 1 MB.</p>

<form hx-post="/files" hx-encoding="multipart/form-data" hx-target="#files" hx-swap="innerHTML" hx-on::after-request="if(event.detail.successful) this.reset()">
  <input type="file" name="file" required>
  <button type="submit">Hochladen</button>
</form>

<div id="files">
  {{template "filesSection" .}}
</div>
{{end}}
