{{define "content"}}
<h1>Meine Dateien</h1>
<p class="muted">Angemeldet als {{.User}}. Maximale Grösse pro Datei: 1 MB.</p>

<form hx-post="/files" hx-encoding="multipart/form-data" hx-target="#files" hx-swap="innerHTML" hx-on::after-request="if(event.detail.successful) this.reset()">
  <input type="file" name="file" required>
  <button type="submit">Hochladen</button>
</form>

<div id="files">
  {{template "filesSection" .}}
</div>

<h2>Einladen</h2>
<p class="muted">Der Link ist 7 Tage gültig und funktioniert nur einmal. Er wird nur einmal angezeigt.</p>
<form hx-post="/invitations" hx-target="#invite" hx-swap="innerHTML">
  <button type="submit">Einladungslink erzeugen</button>
</form>
<div id="invite"></div>
{{end}}
