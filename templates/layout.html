{{define "layout"}}<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hackathon App</title>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <style>
    :root { color-scheme: light dark; --gap: 16px; --accent: #2563eb; }
    body { font-family: system-ui, sans-serif; margin: 0; line-height: 1.5; }
    header { display: flex; flex-wrap: wrap; gap: var(--gap); align-items: center; justify-content: space-between; padding: var(--gap); border-bottom: 1px solid #8884; }
    header a { color: inherit; text-decoration: none; font-weight: 600; }
    nav { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    main { max-width: 640px; margin: 0 auto; padding: var(--gap); }
    form { display: grid; gap: 12px; margin: 16px 0; }
    input, button { font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid #8886; }
    button { background: var(--accent); color: #fff; border: 0; cursor: pointer; }
    button.link { background: none; color: var(--accent); padding: 0; }
    table { width: 100%; border-collapse: collapse; }
    td, th { text-align: left; padding: 8px 4px; border-bottom: 1px solid #8883; font-size: 0.95em; }
    .error { color: #dc2626; }
    .notice { color: #16a34a; }
    .muted { opacity: 0.7; }
    @media (max-width: 480px) { main { padding: 12px; } }
  </style>
</head>
<body>
  <header>
    <a href="/">Hackathon App</a>
    <nav>
      {{- if .User}}
        <a href="/dashboard">Dateien</a>
        {{- if .IsAdmin}}
        <a href="/admin/users">Benutzer</a>
        {{- end}}
        <a href="/app/">Vue-App</a>
        <form method="post" action="/logout" style="display:inline">
          <button class="link" type="submit">Abmelden</button>
        </form>
      {{- else}}
        <a href="/login">Anmelden</a>
        <a href="/register">Registrieren</a>
      {{- end}}
    </nav>
  </header>
  <main>
    {{template "content" .}}
  </main>
</body>
</html>{{end}}
