{{define "content"}}
<h1>Konto erstellen</h1>
<form data-auth-form="register">
  <input type="email" name="email" placeholder="E-Mail" autocomplete="email" required>
  <input type="password" name="password" placeholder="Passwort (mind. 8 Zeichen)" autocomplete="new-password" minlength="8" required>
  <button type="submit">Registrieren</button>
</form>
<p class="error" role="alert" data-auth-message></p>
<p class="muted">Schon registriert? <a href="/login">Anmelden</a></p>
<script type="module" src="/app/auth.js"></script>
{{end}}
