# Build and deploy on every push to main (trigger is created separately, see README).
steps:
  # Rebuild the static React bundle from frontend/ into static/app, so the deployed
  # bundle always matches the committed source.
  - name: node:24
    dir: frontend
    entrypoint: sh
    args:
      - -c
      - npm ci --no-audit --no-fund && npm run build
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - glamhack-app
      - --source=.
      - --function=Handler
      - --base-image=go127
      - --region=us-central1
      - --project=glamhack-hack-2026
      - --allow-unauthenticated
      - --memory=256Mi
      - --min-instances=0
      - --max-instances=2
      - --timeout=60
      - --set-env-vars=PROJECT_ID=glamhack-hack-2026,BUCKET_NAME=glamhack-hack-2026-files
      - --set-secrets=INITIAL_ADMIN_PASSWORD=INITIAL_ADMIN_PASSWORD:latest
      - --set-build-env-vars=GOFLAGS=-buildvcs=false
      - --quiet # Cloud Build has no stdin; never wait for a prompt
options:
  logging: CLOUD_LOGGING_ONLY
